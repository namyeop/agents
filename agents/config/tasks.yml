trend_spotting_task:
  description: >
    지금 현재 바이럴리티가 가장 높은 관련 세부 주제를 리서치한다.

    topic: {{topic}} (예: "원격 근무 생산성")
  expected_output: >
    밈/키워드 목록과 설명, 활용 제안을 포함한 `SubjectResearch` 형식의 Json 출력.
  agent: trend_spotter_agent
  input_vars: [topic]
  verbose: true

meme_research_task:
  description: >
    (SubjectResearch) 와 관련하여 최신 밈, 유행어, 관련 키워드를 조사한다.
    트렌드 소스(레딧, 트위터, 틱톡, 구글 트렌드 등)에서 인기 있는 밈과 키워드를 수집한다.
    각 밈/키워드에 대한 간단한 설명과, 스레드에 어떻게 활용할 수 있을지 제안한다.
  expected_output: >
    밈/키워드 목록과 설명, 활용 제안을 포함한 `MemeResearch` 형식의 Json 출력.
  agent: meme_crafter_agent
  verbose: true
  context: [trend_research]

write_thread_task:
  description: >
    아래 입력으로 주어진 주제에 대해, 스크롤을 멈추게 하는 첫 줄과 명확한 전개,
    안전한 논쟁 포인트, 밈/키워드 반영, 강력한 콜투액션을 포함한 스레드 글을 작성한다.
    
    topic: {{topic}} (예: "생산성 향상을 위한 5가지 팁")
    target_audience: {{target_audience}}
    platform: {{platform}} (예: "트위터", "레딧", "링크드인")
    tone: {{tone}} (예: "친근하고 대화체", "전문적이고 신뢰감 있는")

    해당 글들은 (MemeResearch) 에서 조사된 밈/키워드를 적절히 반영해야 한다.
    톤은 플랫폼 맥락에 맞추고, 과장/허위/인신공격/과도한 클릭베이트는 피한다.
  expected_output: >
    `ThreadCandidate` 을 따르는 JSON 형식의 스레드 초안. 
  agent: hooksmith_agent
  input_vars: [topic, target_audience, platform, constraints]
  verbose: true
  context: [meme_research]

viral_score_task:
  description: >
    (ThreadCandidate)를 0~100 범위로 채점한다. 하위 지표는 훅(25), 신선도/차별성(20),
    명확성/가독성(20), 공유 가능성/저작권 위험 최소화(20), 댓글 유도성(15)로 가중치를 둔다.
    점수 근거와 개선 제안을 함께 제시한다.
  expected_output: >
    `ViralBreakdown` 을 따르는 JSON 형식의 점수표.
  agent: quality_judge_agent
  verbose: true
  context: [write_thread]

review_and_judge_task:
  description: >
    (ViralBreakdown) 을 참고하여
    스레드의 강/약점을 항목별로 진단하고, 3가지 다른 스타일의 개선안(보수/중간/공격적)을 제안한다.
    바이럴 점수의 타당성을 검토하고 필요 시 보정 근거를 제시한다.
  expected_output: >
    `Review` 형식을 따르는 JSON 형식의 리뷰.
  agent: quality_judge_agent
  verbose: true
  context: [score_virality]

refine_thread_task:
  description: >
    (Review) 반영하여 스레드를 개선한다.
    톤과 스타일은 유지하되, 훅을 더 강렬하게 만들고
    명확성과 공유 가능성을 높이며, 댓글 유도성을 강화한다.
  expected_output: >
    `FinalOutput` 을 따르는 JSON 형식의 개선된 스레드 초안
    (기존 스레드와 비교하여 변경된 부분을 강조 표시).
  agent: hooksmith_agent
  verbose: true
  context: [review_and_judge]